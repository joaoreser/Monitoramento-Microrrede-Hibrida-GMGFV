version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net

  grafana:
    image: grafana/grafana-oss:8.5.27
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /opt/grafana-data:/var/lib/grafana
      - /opt/grafana-data/config/grafana.ini:/etc/grafana/grafana.ini
      # Substituição nativa de logos e favicons (ajuste o caminho se necessário)
      - /home/embrapi/favicon_sic.png:/usr/share/grafana/public/img/fav32.png
      - /home/embrapi/logo_sic.svg:/usr/share/grafana/public/img/grafana_icon.svg
      - /home/embrapi/logo_sic.svg:/usr/share/grafana/public/img/grafana_logo.svg
    networks:
      - monitoring-net
    depends_on:
      - prometheus

networks:
  monitoring-net:
    driver: bridge